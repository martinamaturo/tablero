<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal PRO · Dashboard Bursátil Local</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #090f1a; color: #e2e8f0; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .glass-card {
            background: linear-gradient(145deg, #162032 0%, #0d1423 100%);
            border: 1px solid #2a3a51; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s, border-color 0.2s; position: relative;
        }
        .glass-card:hover { transform: translateY(-2px); border-color: #3b82f6; }

        .signal-buy { color: #34d399; border-color: rgba(52, 211, 153, 0.3); background-color: rgba(52, 211, 153, 0.1); }
        .signal-sell { color: #f87171; border-color: rgba(248, 113, 113, 0.3); background-color: rgba(248, 113, 113, 0.1); }
        .signal-hold { color: #fbbf24; border-color: rgba(251, 191, 36, 0.3); background-color: rgba(251, 191, 36, 0.1); }
        
        .fav-star { cursor: pointer; transition: all 0.2s; color: #475569; }
        .fav-star:hover { transform: scale(1.1); color: #fbbf24; }
        .fav-star.active { color: #fbbf24; filter: drop-shadow(0 0 4px rgba(251,191,36,0.6)); }

        .tooltip-container { position: relative; }
        .tooltip-text, .ticker-tooltip {
            visibility: hidden; opacity: 0; background-color: #1e293b; color: #cbd5e1;
            text-align: center; border-radius: 6px; padding: 8px 12px;
            position: absolute; z-index: 20; transition: opacity 0.2s;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); border: 1px solid #475569;
        }
        .tooltip-text { bottom: 125%; left: 50%; transform: translateX(-50%); width: max-content; max-width: 260px; font-size: 0.75rem; }
        .ticker-tooltip { top: 100%; left: 0; margin-top: 8px; width: max-content; min-width: 180px; font-size: 0.75rem; text-align: left; }
        .tooltip-container:hover .tooltip-text, .ticker-hover:hover .ticker-tooltip { visibility: visible; opacity: 1; }
        #chart-modal { backdrop-filter: blur(8px); }
    </style>
</head>

        let portfolio = JSON.parse(localStorage.getItem('dashboard_portfolio_local')) || defaultCartera;

        let currentRisk = 'Todos';

        const tabs = document.querySelectorAll('.tab-btn');
        const riskSelect = document.getElementById('risk-filter');
        const sectionTitle = document.getElementById('section-title');
        const favCountEl = document.getElementById('fav-count');
        const carteraCountEl = document.getElementById('cartera-count');
        const modal = document.getElementById('chart-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalChartContainer = document.getElementById('modal-chart-container');

        function updateCounts() {
            carteraCountEl.textContent = portfolio.length;
            favCountEl.textContent = favorites.length;
        }
        updateCounts();

        function toggleStorage(array, item, key) {
            const index = array.indexOf(item);
            if (index > -1) array.splice(index, 1);
            else array.push(item);
            localStorage.setItem(key, JSON.stringify(array));
            updateCounts();
        }

        function createCard(item) {
            const isFav = favorites.includes(item.ticker);
            const inPortfolio = portfolio.includes(item.ticker);

            const btnPortfolio = currentTab === 'cartera' 
                ? `<button class="btn-remove-port px-2 py-0.5 ml-2 bg-rose-900/40 hover:bg-rose-600 text-rose-300 rounded border border-rose-700 transition" data-ticker="${item.ticker}" title="Quitar de mi cartera">✕</button>`
                : (!inPortfolio ? `<button class="btn-add-port px-2 py-0.5 ml-2 bg-emerald-900/40 hover:bg-emerald-600 text-emerald-300 rounded border border-emerald-700 font-bold transition" data-ticker="${item.ticker}" title="Agregar a mi cartera">＋</button>` : '');

            const statusClass = item.status === 'BUY' ? 'signal-buy' : item.status === 'SELL' ? 'signal-sell' : 'signal-hold';
            const actionText = item.status === 'BUY' ? 'INGRESAR' : item.status === 'HOLD' ? 'VIGILAR' : item.status === 'SELL' ? 'SALIR' : 'ALERTA';

            const card = document.createElement('article');
            card.className = 'glass-card rounded-xl p-5 flex flex-col h-full justify-between';
            card.innerHTML = `
                <div>
                    <div class="flex justify-between items-start mb-3">
                        <div class="ticker-hover relative cursor-default">
                            <h3 class="text-2xl font-black tracking-tight text-white inline-block border-b border-dashed border-slate-500 pb-0.5">${item.ticker}</h3>
                            <div class="text-[11px] text-slate-400 font-semibold tracking-wider">${item.exchange}</div>
                            
                            <div class="ticker-tooltip">
                                <strong class="text-white block mb-1">${item.fullName}</strong>
                                <div class="text-slate-300">Operabilidad: <span class="font-bold text-blue-400">${item.operability}</span></div>
                                <div class="text-slate-300 mt-1">Riesgo: <span class="font-bold ${riskColor}">${item.risk}</span></div>
                            </div>
                        </div>
                        <div class="flex flex-col items-end gap-2">
                            <div class="flex items-center">
                                <svg class="w-6 h-6 fav-star ${isFav ? 'active' : ''}" data-ticker="${item.ticker}" viewBox="0 0 20 20" fill="currentColor">${starIcon}</svg>
                                ${btnPortfolio}
                            </div>
                            <span class="text-[10px] uppercase font-bold px-2 py-1 rounded bg-[#1e293b] text-slate-300 border border-[#334155]">${item.type}</span>
                        </div>
                    </div>
                    
                    <div class="mt-4 mb-5">
                        <div class="tooltip-container border rounded-lg p-3 ${statusClass} cursor-help transition-colors">
                            <div class="flex items-center justify-between">
                                <span class="font-extrabold text-sm tracking-wide">${actionText}</span>
                                <svg class="w-4 h-4 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </div>
                            <div class="tooltip-text font-medium text-left leading-relaxed">
                                <strong class="text-white block mb-1">Fundamento Algorítmico:</strong>
                                ${item.techInfo}
                            </div>
                        </div>
                    </div>
                </div>
                <button class="chart-btn w-full bg-[#1e293b] hover:bg-blue-600 text-slate-200 hover:text-white border border-[#334155] hover:border-blue-500 font-bold py-2.5 px-4 rounded-lg transition-all duration-200 flex justify-center items-center gap-2" data-ticker="${item.ticker}" data-exchange="${item.exchange}">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>
                    Ver Gráfico TV
                </button>
            `;
            return card;
        }

        function renderGrid(tabName) {

            let dataToRender = [];

            if (tabName === 'scanners') {

                sectionTitle.textContent = 'Viendo: Escáner de Oportunidades';
            } else if (tabName === 'cartera') {
                dataToRender = MASTER_DB.filter(item => portfolio.includes(item.ticker));
                sectionTitle.textContent = 'Viendo: Mi Cartera';
            } else if (tabName === 'favoritos') {
                dataToRender = MASTER_DB.filter(item => favorites.includes(item.ticker));
                sectionTitle.textContent = 'Viendo: Mis Favoritos';
                if(dataToRender.length === 0) {
                    grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-500 font-medium bg-[#121b2b] rounded-xl border border-slate-800 border-dashed">No tienes activos marcados como favoritos.</div>`;
                    return;
                }
            }

            if (currentRisk !== 'Todos') dataToRender = dataToRender.filter(item => item.risk === currentRisk);
            sectionTitle.textContent += ` (${dataToRender.length})`;

            dataToRender.forEach(item => grid.appendChild(createCard(item)));

            document.querySelectorAll('.fav-star').forEach(star => {
                star.addEventListener('click', (e) => {
                    toggleStorage(favorites, e.currentTarget.dataset.ticker, 'dashboard_favoritos_local');
                    if (currentTab === 'favoritos') renderGrid(currentTab);
                    else {
                        const icon = e.currentTarget;
                        icon.classList.toggle('active');
                        icon.innerHTML = icon.classList.contains('active') 
                            ? `<path fill-rule="evenodd" d="M10 2.25a.75.75 0 01.673.418l2.204 4.475 4.939.717a.75.75 0 01.416 1.28l-3.573 3.483.844 4.919a.75.75 0 01-1.088.791L10 16.009l-4.415 2.324a.75.75 0 01-1.088-.79l.844-4.92-3.573-3.482a.75.75 0 01.416-1.28l4.939-.717 2.204-4.475A.75.75 0 0110 2.25z" clip-rule="evenodd" />`
                            : `<path fill-rule="evenodd" d="M10 2.25a.75.75 0 01.673.418l2.204 4.475 4.939.717a.75.75 0 01.416 1.28l-3.573 3.483.844 4.919a.75.75 0 01-1.088.791L10 16.009l-4.415 2.324a.75.75 0 01-1.088-.79l.844-4.92-3.573-3.482a.75.75 0 01.416-1.28l4.939-.717 2.204-4.475A.75.75 0 0110 2.25zm0 3.32l-1.614 3.277a.75.75 0 01-.564.41l-3.616.525 2.616 2.55a.75.75 0 01.216.664l-.618 3.601 3.234-1.7a.75.75 0 01.698 0l3.234 1.7-.618-3.601a.75.75 0 01.216-.664l2.616-2.55-3.616-.525a.75.75 0 01-.564-.41L10 5.57z" clip-rule="evenodd" />`;
                    }
                });
            });

            document.querySelectorAll('.btn-add-port').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    toggleStorage(portfolio, e.currentTarget.dataset.ticker, 'dashboard_portfolio_local');
                    renderGrid(currentTab);
                });
            });

            document.querySelectorAll('.btn-remove-port').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    toggleStorage(portfolio, e.currentTarget.dataset.ticker, 'dashboard_portfolio_local');
                    renderGrid(currentTab);
                });
            });

            document.querySelectorAll('.chart-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    openModal(e.currentTarget.dataset.ticker, e.currentTarget.dataset.exchange);
                });
            });
        }

        tabs.forEach(tab => {
            tab.addEventListener('click', (e) => {
                if (currentTab === e.currentTarget.dataset.target) return;
                currentTab = e.currentTarget.dataset.target;
                tabs.forEach(t => {
                    t.classList.remove('bg-blue-600', 'text-white', 'shadow-[0_0_12px_rgba(37,99,235,0.4)]', 'border-blue-500');
                    t.classList.add('bg-slate-800', 'text-slate-300', 'border-slate-700');
                });
                e.currentTarget.classList.remove('bg-slate-800', 'text-slate-300', 'border-slate-700');
                e.currentTarget.classList.add('bg-blue-600', 'text-white', 'shadow-[0_0_12px_rgba(37,99,235,0.4)]', 'border-blue-500');
                renderGrid(currentTab);
            });
        });

        riskSelect.addEventListener('change', (e) => { currentRisk = e.target.value; renderGrid(currentTab); });

        function openModal(ticker, exchange) {
            modalTitle.innerHTML = `<span class="text-blue-500">${ticker}</span> <span class="text-slate-500 font-medium text-sm ml-2">${exchange}</span>`;
            modal.classList.remove('hidden'); modal.classList.add('flex'); document.body.style.overflow = 'hidden'; 
            modalChartContainer.innerHTML = `<div id="tv_widget_modal" class="w-full h-full"></div>`;
            const script = document.createElement('script');
            script.type = 'text/javascript'; script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js'; script.async = true;
            script.innerHTML = JSON.stringify({
                "autosize": true, "symbol": `${exchange}:${ticker}`, "interval": "D", "timezone": "America/Argentina/Buenos_Aires",
                "theme": "dark", "style": "1", "locale": "es", "enable_publishing": false, "backgroundColor": "#090f1a",
                "gridColor": "#1e293b", "hide_top_toolbar": false, "hide_legend": false, "save_image": false,
                "container_id": "tv_widget_modal", "support_host": "https://www.tradingview.com", "studies": ["STD;SMA", "STD;RSI", "VolumeProfileFixedRange@tv-basicstudies"]
            });
            document.getElementById('tv_widget_modal').appendChild(script);
        }

        document.getElementById('close-modal').addEventListener('click', () => {
            modal.classList.add('hidden'); modal.classList.remove('flex'); document.body.style.overflow = 'auto'; modalChartContainer.innerHTML = ''; 
        });

        // Inicializamos directamente el render sin fetch de JSON externo.
        renderGrid('scanners');
    </script>
</body>
</html>
