name: Actualizador Diario de Señales

on:
  schedule:
    - cron: '30 21 * * 1-5' # Lunes a Viernes a las 21:30 UTC
  workflow_dispatch: # Permite ejecución manual desde GitHub

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Ejecutar motor de análisis
        run: python actualizador.py

      - name: Commit y Push de data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Actualización automática de cierre NYSE" || echo "Sin cambios para commitear"
          git push
